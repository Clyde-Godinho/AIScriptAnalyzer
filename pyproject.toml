[project]
name = "s390x-doc-script-analyzer"
version = "0.1.0"
description = "AI-powered documentation/script consistency analyzer for Linux on IBM Z (s390x)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "instructor>=1.5",
    "openai>=1.40",
    "chromadb>=0.5.5",
    "tenacity>=8.5",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.10"]
anthropic = ["anthropic>=0.34"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
